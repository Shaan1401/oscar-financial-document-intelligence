<svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favNavyGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#101B2D" />
      <stop offset="100%" stopColor="#080F1C" />
    </linearGradient>
    <linearGradient id="favGoldGrad" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F5EEDC" />
      <stop offset="50%" stopColor="#D6B36A" />
      <stop offset="100%" stopColor="#C49F52" />
    </linearGradient>
    <linearGradient id="favAccentGrad" x1="9" y1="23" x2="23" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#20B889" />
      <stop offset="60%" stopColor="#D6B36A" />
      <stop offset="100%" stopColor="#F5EEDC" />
    </linearGradient>
  </defs>

  <!-- Elevated Navy Surface with subtle Gold metallic frame -->
  <rect
    x="1"
    y="1"
    width="30"
    height="30"
    rx="7"
    fill="url(#favNavyGrad)"
    stroke="#D6B36A"
    strokeWidth="1.4"
    strokeOpacity="0.8"
  />

  <!-- 1. Document / Bank Statement Silhouette with Folded Corner -->
  <path
    d="M8.5 6.5C8.5 5.67157 9.17157 5 10 5H18.5L23.5 10V24C23.5 24.8284 22.8284 25.5 22 25.5H10C9.17157 25.5 8.5 24.8284 8.5 24V6.5Z"
    fill="#17243A"
    fillOpacity="0.6"
    stroke="url(#favGoldGrad)"
    strokeWidth="1.4"
    strokeLinejoin="round"
  />

  <!-- Folded Corner Ear Flap -->
  <path
    d="M18.5 5V10H23.5"
    stroke="url(#favGoldGrad)"
    strokeWidth="1.3"
    strokeLinejoin="round"
    fill="#D6B36A"
    fillOpacity="0.25"
  />

  <!-- 2. Statement Ledger Transaction Lines -->
  <line
    x1="11.5"
    y1="12"
    x2="16.5"
    y2="12"
    stroke="#DFC793"
    strokeWidth="1.5"
    strokeLinecap="round"
  />
  <line
    x1="11.5"
    y1="15"
    x2="15"
    y2="15"
    stroke="#DFC793"
    strokeWidth="1.5"
    strokeLinecap="round"
    strokeOpacity="0.8"
  />

  <!-- 3. Upward Financial Analytics & Reconciliation Trajectory -->
  <path
    d="M11.5 21.5L14.5 18.5L17.5 20.5L21.5 15"
    stroke="url(#favAccentGrad)"
    strokeWidth="1.8"
    strokeLinecap="round"
    strokeLinejoin="round"
  />

  <!-- Terminal Reconciliation Proof Node Dot -->
  <circle
    cx="21.5"
    cy="15"
    r="1.5"
    fill="#F5EEDC"
    stroke="#D6B36A"
    strokeWidth="0.9"
  />
</svg>
